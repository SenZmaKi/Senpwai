<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTTP Download Engine — Senpwai</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(900px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.iso-stage {
  cursor: pointer;
  touch-action: pan-y;
}
.iso-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}
.iso-plate:has(.iso-stage) {
  overflow: hidden;
}
.tb-lead {
  margin: 0 0 16px;
  color: var(--anatomy-text);
  font-size: 14.5px;
  line-height: 1.6;
}

/* Explorer: the panel, stage tracker, legend and notes around a figure.
   Every colour is an anatomy token, so light and dark both work. */
.ex-icon{width:16px;height:16px;flex:none;display:block}
.ex-panel,.ex-legend,.ex-notes{margin-top:14px;font-size:13px;line-height:1.5;color:var(--anatomy-text)}
.ex-panel{border:1px solid var(--anatomy-faint);border-radius:12px;background:var(--anatomy-card);overflow:hidden}
.ex-panel :focus-visible,.ex-legend :focus-visible,.ex-notes :focus-visible{outline:2px solid var(--anatomy-mid);outline-offset:2px}

/* Transport */
.ex-transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--anatomy-faint);background:var(--anatomy-page)}
.ex-btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:500;color:var(--anatomy-strong);background:var(--anatomy-card);border:1px solid var(--anatomy-lo);border-radius:8px;padding:6px 11px;cursor:pointer;transition:border-color .15s,background .15s}
.ex-btn:hover{border-color:var(--anatomy-mid)}
.ex-btn[aria-pressed="true"]{border-color:var(--anatomy-hi);background:var(--anatomy-face)}
.ex-primary{background:var(--anatomy-strong);color:var(--anatomy-card);border-color:var(--anatomy-strong)}
.ex-primary:hover{border-color:var(--anatomy-strong);opacity:.9}
.ex-ghost{border-color:transparent;background:none;color:var(--anatomy-text)}
.ex-phase{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;border:1px solid var(--anatomy-faint);color:var(--anatomy-strong);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-phase:empty{display:none}
.ex-phase::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--anatomy-mid)}
.ex-phase[data-tone="ok"]::before{background:var(--anatomy-green)}
.ex-phase[data-tone="wait"]::before{background:var(--anatomy-red);animation:ex-pulse 1s ease-in-out infinite}
.ex-phase[data-tone="idle"]::before{background:var(--anatomy-lo)}
@keyframes ex-pulse{50%{opacity:.35}}

/* Segmented controls */
.ex-seg{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--anatomy-lo);border-radius:8px;background:var(--anatomy-card)}
.ex-seg>.ex-icon{margin:0 4px 0 6px;color:var(--anatomy-muted)}
.ex-seg label{position:relative;cursor:pointer}
.ex-seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ex-seg span{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.ex-seg input:checked+span{background:var(--anatomy-strong);color:var(--anatomy-card)}
.ex-seg input:focus-visible+span{outline:2px solid var(--anatomy-mid);outline-offset:1px}

/* Layout */
.ex-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.ex-col{min-width:0}
.ex-col+.ex-col{border-left:1px solid var(--anatomy-faint)}
@media (max-width:820px){.ex-grid{grid-template-columns:1fr}.ex-col+.ex-col{border-left:0;border-top:1px solid var(--anatomy-faint)}}
.ex-col>section{padding:14px 16px}
.ex-col>section+section{border-top:1px solid var(--anatomy-faint)}

/* Headings */
.ex-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.ex-head>.ex-icon{width:30px;height:30px;padding:7px;border-radius:8px;background:var(--anatomy-page);border:1px solid var(--anatomy-faint);color:var(--anatomy-strong)}
.ex-head>div{flex:1;min-width:0}
.ex-head h3{margin:0;font-size:13px;font-weight:600;color:var(--anatomy-strong)}
.ex-head p{margin:1px 0 0;color:var(--anatomy-muted);font-size:12px}
.ex-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--anatomy-faint);color:var(--anatomy-muted);white-space:nowrap}
.ex-badge .ex-icon{width:12px;height:12px}

/* Controls */
.ex-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px}
.ex-control{min-width:0}
.ex-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ex-label{display:inline-flex;align-items:center;gap:6px;color:var(--anatomy-strong);font-weight:500}
.ex-label .ex-icon{color:var(--anatomy-muted)}
.ex-row output{margin-left:auto;color:var(--anatomy-strong);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-reset{display:inline-grid;place-items:center;width:22px;height:22px;padding:0;border:0;border-radius:6px;background:none;color:var(--anatomy-muted);cursor:pointer;visibility:hidden}
.ex-reset:hover{color:var(--anatomy-strong);background:var(--anatomy-page)}
.ex-reset .ex-icon{width:14px;height:14px}
.ex-control[data-changed] .ex-reset,.ex-reset-section{visibility:visible}
.ex-help{margin:6px 0 0;color:var(--anatomy-muted);font-size:12px}
.ex-control select{width:100%;font:inherit;color:var(--anatomy-strong);background:var(--anatomy-page);border:1px solid var(--anatomy-lo);border-radius:8px;padding:6px 8px;cursor:pointer}
.ex-control input[type=range]{--fill:50%;width:100%;height:18px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.ex-control input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--anatomy-hi) var(--fill),var(--anatomy-lo) var(--fill))}
.ex-control input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--anatomy-hi) var(--fill),var(--anatomy-lo) var(--fill))}
.ex-control input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--anatomy-card);border:2px solid var(--anatomy-hi)}
.ex-control input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--anatomy-card);border:2px solid var(--anatomy-hi)}
.ex-switch{width:34px;height:20px;-webkit-appearance:none;appearance:none;border-radius:999px;background:var(--anatomy-lo);position:relative;cursor:pointer;margin:0}
.ex-switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--anatomy-card);transition:transform .15s}
.ex-switch:checked{background:var(--anatomy-strong)}
.ex-switch:checked::after{transform:translateX(14px)}

/* Chips: scenarios and actions */
.ex-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ex-chip{display:flex;align-items:flex-start;gap:8px;text-align:left;font:inherit;color:var(--anatomy-text);background:var(--anatomy-page);border:1px solid var(--anatomy-faint);border-radius:10px;padding:8px 10px;cursor:pointer;transition:border-color .15s}
.ex-chip:hover{border-color:var(--anatomy-mid)}
.ex-chip[aria-pressed="true"]{border-color:var(--anatomy-hi)}
.ex-chip>.ex-icon{margin-top:2px;color:var(--anatomy-strong)}
.ex-chip strong{display:block;color:var(--anatomy-strong);font-weight:500}
.ex-chip small{display:block;color:var(--anatomy-muted);font-size:11.5px;line-height:1.4}

/* Live stats */
.ex-stats dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ex-stat{display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:center;padding:9px 10px;border:1px solid var(--anatomy-faint);border-radius:10px;background:var(--anatomy-page)}
.ex-stat>.ex-icon{color:var(--anatomy-muted);width:14px;height:14px}
.ex-stat dt{color:var(--anatomy-muted);font-size:11.5px}
.ex-stat dd{grid-column:1/-1;margin:3px 0 0;color:var(--anatomy-strong);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-stat p{grid-column:1/-1;margin:2px 0 0;color:var(--anatomy-muted);font-size:11.5px;line-height:1.35}

/* Stage tracker */
.ex-stages ol{list-style:none;margin:0;padding:0;position:relative}
.ex-stages li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:0 0 12px;position:relative;transition:opacity .2s}
.ex-stages li:not(:last-child)::before{content:"";position:absolute;left:14.5px;top:30px;bottom:2px;width:1px;background:var(--anatomy-faint)}
.ex-step{position:relative;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--anatomy-faint);background:var(--anatomy-page);color:var(--anatomy-muted)}
.ex-step b{position:absolute;right:-4px;bottom:-4px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--anatomy-card);border:1px solid var(--anatomy-faint);font-size:9.5px;line-height:13px;text-align:center;color:var(--anatomy-muted)}
.ex-stages strong{display:block;color:var(--anatomy-strong);font-weight:500;padding-top:5px}
.ex-stages p{margin:2px 0 0;color:var(--anatomy-muted);font-size:12px}
.ex-stages li[data-state="next"]{opacity:.55}
.ex-stages li[data-state="done"] .ex-step{color:var(--anatomy-text)}
.ex-stages li[data-state="active"] .ex-step{border-color:var(--anatomy-hi);color:var(--anatomy-card);background:var(--anatomy-strong);box-shadow:0 0 0 4px var(--anatomy-faint)}
.ex-stages li[data-state="active"] p{color:var(--anatomy-text)}

/* Legend */
.ex-legend{padding:0}
.ex-legend ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:6px}
.ex-part{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:6px 10px 6px 6px;border:1px solid transparent;border-radius:10px;cursor:pointer;color:var(--anatomy-text);font-size:13px;line-height:1.45}
.ex-part:hover,.ex-part:focus-visible{border-color:var(--anatomy-lo);background:var(--anatomy-card)}
.ex-part[aria-pressed="true"]{border-color:var(--anatomy-hi);background:var(--anatomy-card)}
.ex-part strong{display:block;color:var(--anatomy-strong);font-weight:600}
.ex-thumb{overflow:hidden;width:96px;height:64px;border-radius:8px;background:var(--anatomy-card);border:1px solid var(--anatomy-faint)}

/* Notes */
.ex-notes{border:1px solid var(--anatomy-faint);border-radius:12px;background:var(--anatomy-card)}
.ex-notes summary{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;color:var(--anatomy-strong);font-weight:500;list-style:none}
.ex-notes summary::-webkit-details-marker{display:none}
.ex-notes summary .ex-icon:last-child{margin-left:auto;transition:transform .2s;color:var(--anatomy-muted)}
.ex-notes[open] summary .ex-icon:last-child{transform:rotate(180deg)}
.ex-notes ul{margin:0;padding:0 16px 12px 36px;color:var(--anatomy-text)}
.ex-notes li+li{margin-top:4px}

ect width="6" height="6" x="9" y="9" rx="1" /><path d="M15 2v2" /><path d="M15 20v2" /><path d="M2 15h2" /><path d="M2 9h2" /><path d="M20 15h2" /><path d="M20 9h2" /><path d="M9 2v2" /><path d="M9 20v2" /></svg><dt>Active workers</dt><dd data-stat="workers">–</dd><p>Concurrent Range connections active</p></div><div class="ex-stat" data-stat-tile="tokens"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4" /><path d="M3.34 19a10 10 0 1 1 17.32 0" /></svg><dt>Token credit</dt><dd data-stat="tokens">–</dd><p>Throttler token bucket balance</p></div><div class="ex-stat" data-stat-tile="blocks"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="9" y2="9" /><line x1="4" x2="20" y1="15" y2="15" /><line x1="10" x2="8" y1="3" y2="21" /><line x1="16" x2="14" y1="3" y2="21" /></svg><dt>1 MB Blocks</dt><dd data-stat="blocks">–</dd><p>SHA-256 hash-verified 1024 KiB blocks</p></div><div class="ex-stat" data-stat-tile="checkpoints"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19v-3" /><path d="M10 19v-3" /><path d="M14 19v-3" /><path d="M18 19v-3" /><path d="M8 11V9" /><path d="M16 11V9" /><path d="M12 11V9" /><path d="M2 15h20" /><path d="M2 7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1.1a2 2 0 0 0 0 3.837V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5.1a2 2 0 0 0 0-3.837Z" /></svg><dt>Checkpoints</dt><dd data-stat="checkpoints">–</dd><p>Durable flushes to .checkpoint file</p></div><div class="ex-stat" data-stat-tile="etag"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></svg><dt>ETag Validator</dt><dd data-stat="etag">–</dd><p>Strong remote file identity lock</p></div><div class="ex-stat" data-stat-tile="phase"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg><dt>Lifecycle stage</dt><dd data-stat="phase">–</dd></div></dl></section><section class="ex-stages" aria-label="How it works"><header class="ex-head"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></svg><div><h3>How it works</h3><p>The lit step is what the model is doing now</p></div></header><ol><li data-stage="probe"><span class="ex-step"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></svg><b>1</b></span><div><strong>Probe &amp; Validator Handshake</strong><p>Feeler arm issues Range: bytes=0-1. Verifies 206 Partial Content support, checks content-length, and captures strong ETag validator (<span data-stat="etag"></span>).</p></div></li><li data-stage="allocate"><span class="ex-step"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" x2="2" y1="12" y2="12" /><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /><line x1="6" x2="6.01" y1="16" y2="16" /><line x1="10" x2="10.01" y1="16" y2="16" /></svg><b>2</b></span><div><strong>Pre-allocation &amp; Checkpoint Verification</strong><p>Target .senpwai-part payload is opened and pre-allocated with raf.truncate(<span data-stat="size"></span>). If resuming, existing 1 MB SHA-256 blocks are verified against .checkpoint.</p></div></li><li data-stage="stream"><span class="ex-step"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="16" x="4" y="4" rx="2" /><rect width="6" height="6" x="9" y="9" rx="1" /><path d="M15 2v2" /><path d="M15 20v2" /><path d="M2 15h2" /><path d="M2 9h2" /><path d="M20 15h2" /><path d="M20 9h2" /><path d="M9 2v2" /><path d="M9 20v2" /></svg><b>3</b></span><div><strong>Parallel Sliced Streaming</strong><p>Multi-spindle heads stream chunks across computed byte slices (<span data-stat="workers"></span> connections). Bytes pass through the token bucket governor into the synchronized offset writer.</p></div></li><li data-stage="checkpoint"><span class="ex-step"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19v-3" /><path d="M10 19v-3" /><path d="M14 19v-3" /><path d="M18 19v-3" /><path d="M8 11V9" /><path d="M16 11V9" /><path d="M12 11V9" /><path d="M2 15h20" /><path d="M2 7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1.1a2 2 0 0 0 0 3.837V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5.1a2 2 0 0 0 0-3.837Z" /></svg><b>4</b></span><div><strong>5 s Checkpoint Flush &amp; Block Hash</strong><p>Every 1024 KiB computes a SHA-256 hash (<span data-stat="blocks"></span> blocks verified). Every 5 seconds the file handle flushes and writes atomic JSON checkpoint state with a .bak backup.</p></div></li><li data-stage="finalize"><span class="ex-step"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg><b>5</b></span><div><strong>Atomic Publication &amp; Rename</strong><p>All worker slices verify 100% complete. The writer closes and the engine atomically renames the temporary .senpwai-part file to the destination filename.</p></div></li></ol></section></div></div></div><section class="ex-legend" aria-label="Parts of the machine"><header class="ex-head"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg><div><h3>Parts of the machine</h3><p>Hover or press a part to light it in the figure</p></div></header><ul><li><button type="button" class="ex-part" data-key="billet" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg ex-thumb" viewBox="0 0 96 64" aria-hidden="true"><g data-key="base"><path class="iso-halo" d="M-48.8 11.1L-48.7 10.8L-48.5 10.5L-48.1 10.1L-47.6 9.9L-13 -5.8L-12.4 -6.1L-11.7 -6.2L-11 -6.3L-10.2 -6.3L-9.5 -6.3L-8.8 -6.2L-8.1 -6L-7.5 -5.8L127.7 59.9L128.1 60.2L128.5 60.5L128.7 60.9L128.7 61.2L128.7 66.3L128.6 66.7L128.4 67L128 67.3L127.6 67.6L92.9 83.3L92.3 83.5L91.6 83.7L90.9 83.8L90.2 83.8L89.4 83.8L88.7 83.6L88 83.5L87.5 83.2L-47.7 17.5L-48.2 17.3L-48.5 16.9L-48.7 16.6L-48.8 16.2Z"/><g class="iso-solid"><path class="iso-fill" d="M-13.8 3.6L-13.7 3.2L-13.3 2.8L-12.8 2.5L-12.1 2.3L-11.2 2.1L-10.4 2.1L-9.5 2.1L-8.7 2.3L-8 2.5L-7.5 2.9L-7.2 3.3L-7.1 3.7L-7.1 4.4L-7.2 4.8L-7.5 5.2L-8.1 5.5L-8.8 5.8L-9.6 5.9L-10.5 6L-11.4 5.9L-12.2 5.8L-12.9 5.5L-13.4 5.2L-13.7 4.8L-13.8 4.4Z"/><path class="iso-shade" data-shade="0" d="M-8.1 5.5L-8.8 5.8L-8.8 5L-8.1 4.8ZM-7.1 4.4L-7.2 4.8L-7.2 4.1L-7.1 3.7ZM-7.2 9454884133,22.23981389154727 25.990590277636826,23.1249221320363"/></g></g></svg><span class="ex-part-text"><strong>Vernier Megabyte Ruler &amp; Cursor</strong><span>Graduated byte scale along the bench bed. The Vernier cursor tracks overall download completion across all concurrent range slices.</span></span></button></li></ul></section><details class="ex-notes"><summary><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg><span>What this model simplifies</span><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></summary><ul><li>SHA-256 block hashing runs in a background isolate transfer worker; the simulation treats hash computation as immediate upon chunk arrival.</li><li>Real HTTP transfers receive variable-sized TCP packets (~16 KiB - 64 KiB); the visual model advances smooth burnished silver bands.</li><li>Disk allocation uses OS RandomAccessFile.truncate; the simulated billet visually shows the full pre-allocated length from the initial allocation step.</li><li>AnimeHeaven and certain CDNs treat bytes=0-0 as a full file request; the engine and this model always issue the validated bytes=0-1 probe.</li><li>Atomic publication renames <file>.senpwai-part to final destination; a completed checkpoint is written before renaming to allow crash recovery across the publication window.</li></ul></details></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;

Object.assign(W, { X0, X1, FILE_SPAN, PLATE, PLATE_H, FOOT_H, BILLET_Y, BILLET_Z, BILLET_R, RAIL_Y_BACK, RAIL_Y_FRONT, RAIL_Z, RAIL_R, RAIL_X0, RAIL_X1, GOV_X, GOV_Y, GOV_BASE_Z, SIGHT_Z0, SIGHT_Z1, SIGHT_R, DIAL_X, DIAL_Y, DIAL_Z, DIAL_R, DRUM_X, DRUM_Y, DRUM_Z, DRUM_R, DRUM_W, CHUCK_X, CHUCK_Y, CHUCK_Z, CHUCK_R, RULER_X0, RULER_X1, RULER_Y, RULER_Z, RULER_W, RULER_D, RULER_H, PROBE_PIVOT });

const TAU = Math.PI * 2;
const LIGHT_UP = 1.2;
const BANDS = [0, 0.2, 0.42, 0.62];

const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const len3 = (a) => Math.hypot(a[0], a[1], a[2]);
const unit3 = (a) => {
  const length = len3(a) || 1;
  return [a[0] / length, a[1] / length, a[2] / length];
};
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function viewOf(P) {
  const { sinA, cosA, sinE, cosE } = cameraOf(P);
  return [cosA * cosE, sinA * cosE, sinE];
}

function lightOf(P) {
  const { sinA, cosA } = cameraOf(P);
  return unit3([-sinA, cosA, LIGHT_UP]);
}

const scaleOf = (P) => cameraOf(P).k;

function bandOf(score) {
  let tone = 0;
  while (tone < BANDS.length && score >= BANDS[tone]) tone++;
  return tone;
}

const toneOf = (normal, P) => bandOf(dot3(unit3(normal), lightOf(P)));

function frameAlong(o, a) {
  const axis = unit3(a);
  const helper = Math.abs(axis[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1];
  const u = unit3(cross3(helper, axis));
  const v = cross3(axis, u);
  return { o, a: axis, u, v };
}

const frameOf = (o, a, u, v) => ({ o, a, u, v });

function pointOf(F, s, r, angle) {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [
    F.o[0] + F.a[0] * s + r * (c * F.u[0] + n * F.v[0]),
    F.o[1] + F.a[1] * s + r * (c * F.u[1] + n * F.v[1]),
    F.o[2] + F.a[2] * s + r * (c * F.u[2] + n * F.v[2]),
  ];
}

const radialOf = (F, angle) => {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [c * F.u[0] + n * F.v[0], c * F.u[1] + n * F.v[1], c * F.u[2] + n * F.v[2]];
};

const tangentOf = (F, angle) => {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [-n * F.u[0] + c * F.v[0], -n * F.u[1] + c * F.v[1], -n * F.u[2] + c * F.v[2]];
};

const angleToward = (F, direction) => Math.atan2(dot3(direction, F.v), dot3(direction, F.u));

function hullTagged(points) {
  const sorted = [...points].sort((a, b) => a.p[0] - b.p[0] || a.p[1] - b.p[1]);
  if (sorted.length < 3) return sorted;
  const cross = (o, a, b) => (a.p[0] - o.p[0]) * (b.p[1] - o.p[1]) - (a.p[1] - o.p[1]) * (b.p[0] - o.p[0]);
  const lower = [];
  for (const point of sorted) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 1e-9) lower.pop();
    lower.push(point);
  }
  const upper = [];
  for (let index = sorted.length - 1; index >= 0; index--) {
    const point = sorted[index];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 1e-9) upper.pop();
    upper.push(point);
  }
  return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}

const hullOf = (points) => hullTagged(points.map((p) => ({ p }))).map(({ p }) => p);

function runsOf(flags) {
  const count = flags.length;
  const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
  if (start < 0) return flags[0] ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
  const runs = [];
  let run = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    if (flags[index]) {
      if (!run) run = [index];
      run.push((index + 1) % count);
    } else if (run) {
      runs.push(run);
      run = null;
    }
  }
  if (run) runs.push(run);
  return runs;
}

function groupsOf(keys) {
  const count = keys.length;
  const out = [];
  const start = keys.findIndex((key, index) => key !== keys[(index + count - 1) % count]);
  if (start < 0) {
    if (keys[0] !== null) out.push({ key: keys[0], run: Array.from({ length: count + 1 }, (_, index) => index % count) });
    return out;
  }
  let current = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    const key = keys[index];
    if (current && current.key === key) {
      current.run.push((index + 1) % count);
      continue;
    }
    if (current && current.key !== null) out.push(current);
    current = { key, run: [index, (index + 1) % count] };
  }
  if (current && current.key !== null) out.push(current);
  return out;
}

const stepsFor = (radius, least = 16, most = 112, scale = 0) => Math.max(least, Math.min(most, scale ? Math.ceil((TAU * radius * scale) / 3) : Math.round((radius * 1.3) / 4) * 4));

function chains(edges) {
  const out = [];
  let current = null;
  for (const [a, b, keep] of edges) {
    if (!keep) {
      if (current) out.push(current);
      current = null;
      continue;
    }
    if (!current) current = [a];
    current.push(b);
  }
  if (current) out.push(current);
  if (out.length > 1 && edges[0][2] && edges[edges.length - 1][2]) {
    const last = out.pop();
    out[0] = [...last, ...out[0].slice(1)];
  }
  return out;
}

function labelledArcs(nr, na, view, light, gr = nr, ga = na) {
  const cuts = [];
  if (Math.abs(gr) > 1e-9) {
    const visibleCut = -(ga * view.a) / (gr * view.flat);
    if (visibleCut > -1 && visibleCut < 1) {
      const d = Math.acos(visibleCut);
      cuts.push(view.phi - d, view.phi + d);
    }
  }
  if (Math.abs(nr) > 1e-9) {
    for (const threshold of BANDS) {
      const c = (threshold - na * light.a) / (nr * light.flat);
      if (c > -1 && c < 1) {
        const d = Math.acos(c);
        cuts.push(light.phi - d, light.phi + d);
      }
    }
  }
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const sorted = [...new Set(cuts.map((angle) => Math.round(wrap(angle) * 1e9) / 1e9))].sort((a, b) => a - b);
  const label = (angle) => {
    const facing = gr * view.flat * Math.cos(angle - view.phi) + ga * view.a;
    if (facing <= 1e-9) return -1;
    return bandOf(nr * light.flat * Math.cos(angle - light.phi) + na * light.a);
  };
  if (!sorted.length) {
    const tone = label(0);
    return tone < 0 ? [] : [{ tone, from: 0, to: TAU, full: true }];
  }
  const arcs = sorted.map((from, index) => {
    const to = index + 1 < sorted.length ? sorted[index + 1] : sorted[0] + TAU;
    return { tone: label((from + to) / 2), from, to };
  });
  const merged = [];
  for (const arc of arcs) {
    const last = merged[merged.length - 1];
    if (last && last.tone === arc.tone && Math.abs(last.to - arc.from) < 1e-9) last.to = arc.to;
    else merged.push({ ...arc });
  }
  if (merged.length > 1 && merged[0].tone === merged[merged.length - 1].tone && Math.abs(merged[merged.length - 1].to - TAU - merged[0].from) < 1e-9) {
    const last = merged.pop();
    merged[0].from = last.from - TAU;
  }
  return merged.filter((arc) => arc.tone >= 0);
}

function hermiteSlopes(run) {
  const n = run.length - 1;
  const h = Array.from({ length: n }, (_, j) => run[j + 1][0] - run[j][0]);
  const delta = h.map((value, j) => (run[j + 1][1] - run[j][1]) / value);
  const d = new Array(n + 1).fill(0);
  const end = (h0, h1, d0, d1) => {
    let value = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(value) !== Math.sign(d0)) value = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(value) > Math.abs(3 * d0)) value = 3 * d0;
    return value;
  };
  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);
  }
  return d;
}

function curveRuns(meridian) {
  const m = meridian.length;
  const segments = new Array(m - 1).fill(null);
  let start = 0;
  while (start < m - 1) {
    let end = start + 1;
    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;
    const run = meridian.slice(start, end + 1);
    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };
  const light = { a: dot3(F.a, L), flat: Math.hypot(dot3(F.u, L), dot3(F.v, L)), phi: Math.atan2(dot3(F.v, L), dot3(F.u, L)) };
  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr) || 1;
    faces.push([ds / length, -dr / length]);
  }
  const splines = slope ? null : curveRuns(meridian);
  const vertexNormal = (k, own) => {
    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const normalAt = (i, u) => {
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    const sign = Math.sign(s1 - s0) || 1;
    const g = slope ? slope(s) : splines[i] ? splines[i].slope(s) : null;
    if (g !== null) {
      const length = Math.hypot(1, g);
      return [sign / length, (-sign * g) / length];
    }
    const a = vertexNormal(i, faces[i]);
    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const pointAt = (i, u, angle) => {
    const [s0, r0] = meridian[i];
    const [s1, r1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    return iso(pointOf(F, s, radius ? radius(s) : splines && splines[i] ? splines[i].radius(s) : r0 + (r1 - r0) * u, angle), P);
  };
  const buckets = [[], [], [], [], []];
  const fine = TAU / Math.max(24, Math.min(192, steps * 1.5));
  const arcPoints = (i, u, from, to) => {
    const count = Math.max(1, Math.ceil((to - from) / fine));
    return Array.from({ length: count + 1 }, (_, index) => pointAt(i, u, from + ((to - from) * index) / count));
  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;
    mid = ((mid % TAU) + TAU) % TAU;
    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));
    return { i, u, groups };
  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };
  const align = (reference, arc) => {
    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;
    while ((out.from + out.to) / 2 - centre > Math.PI) {
      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {
      out.from += TAU;
      out.to += TAU;
    }
    return out;
  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));

  const R = right.map((point) => iso(point, P));

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);

  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);

  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);

    tones.push(toneRow);

  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);

    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;

    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);

      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);

    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),

}

function shapeOf(meridian, P, smooth) {

    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

  let outline;

    shape.forEach(([s, r], index) => {

      const keepLast = rims === "last" || rims === "ends";

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));

    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",

    shades: buckets.slice(0, 4).map((list) => list.join("")),

}

function prismOf(F, polygon, s0, s1, P) {

  const L = lightOf(P);

  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];

  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));

  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);

}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);

function sphereOf(centre, r, P, { steps = 48 } = {}) {

    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>

    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {

  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);

    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));

  };

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {

  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;

    return lo;
  };

    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];

    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });

    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {

const DEFAULTS = {

  workers: 4,
  networkSpeedMBps: 16,
  throttleLimitMBps: 0, // 0 = unlimited
  serverMode: "range_etag", // "range_etag" | "range_no_etag" | "no_range"

/** Exactly matches Download.computePartRanges in download.dart */
function computePartRanges(sizeMB, count) {
  const minPerPart = Math.floor(sizeMB / count);
  const extra = sizeMB % count;
  let start = 0;
  const ranges = [];
  for (let i = 0; i < count; i++) {
    const len = minPerPart + (i < extra ? 1 : 0);
    if (len <= 0) continue;
    ranges.push({
      index: i,
      start,
      end: start + len,
      length: len,
    });
    start += len;
  }
  return ranges;
}

function createInitialState(config = DEFAULTS) {
  const parts = computePartRanges(config.fileSizeMB, config.workers);
  return {
    stage: "probe", // "probe" | "allocate" | "stream" | "checkpoint" | "finalize" | "paused" | "error"
    time: 0,
    probeProgress: 0,
    allocateProgress: 0,
    ranges: parts,
    partDones: parts.map(() => 0),
    partSpeeds: parts.map(() => 0),
    tokenBucket: config.throttleLimitMBps > 0 ? config.throttleLimitMBps : 0,
    lastCheckpointTime: 0,
    checkpointsFlushed: 0,
    committedBlocks: 0,
    etag: config.serverMode === "no_range" ? null : '"3f89a-senpwai"',
    etagMatched: true,
    published: false,
    errorMessage: null,
    interruptedAt: null,
  };
}

function derive(config, state) {
  const ranges = state.ranges;
  const totalDownloaded = state.partDones.reduce((sum, d) => sum + d, 0);
  const totalLength = config.fileSizeMB;
  const progressRatio = totalLength > 0 ? Math.min(1, totalDownloaded / totalLength) : 0;
  const activeWorkersCount = state.stage === "stream" 
    ? (config.serverMode === "no_range" ? 1 : ranges.filter((r, i) => state.partDones[i] < r.length).length)
    : 0;
  const currentSpeed = state.partSpeeds.reduce((sum, s) => sum + s, 0);

  return {
    totalDownloaded,
    totalLength,
    progressRatio,
    activeWorkersCount,
    currentSpeed,
    committedBlocks: Math.min(Math.floor(totalDownloaded / BLOCK_SIZE_MB), totalLength),

}

/** Pure step transition for the simulation */
function step(state, dt, config) {
  if (state.stage === "paused" || state.stage === "finalize" || state.stage === "error") {
    return { ...state, time: state.time + dt };
  }

  const s = { ...state, time: state.time + dt };

  // 1. Probe Phase (bytes=0-1)
  if (s.stage === "probe") {
    s.probeProgress += dt / 0.45; // takes ~0.45s
    if (s.probeProgress >= 1) {
      s.probeProgress = 1;
      s.stage = "allocate";
      // Fallback: without Range Support, force 1 worker
      if (config.serverMode === "no_range") {
        s.ranges = computePartRanges(config.fileSizeMB, 1);
        s.partDones = [0];
        s.partSpeeds = [0];
      }
    }
    return s;
  }

  // 2. Pre-allocation & Checkpoint Verification Phase
  if (s.stage === "allocate") {
    s.allocateProgress += dt / 0.35; // takes ~0.35s
    if (s.allocateProgress >= 1) {
      s.allocateProgress = 1;
      s.stage = "stream";
      s.lastCheckpointTime = s.time;
    }
    return s;
  }

  // 3. Streaming Phase
  if (s.stage === "stream") {
    const isLimited = config.throttleLimitMBps > 0;
    let availableMBps = config.networkSpeedMBps;

    // Token-bucket throttler: clamp burst to 2 * maxBytesPerSecond
    if (isLimited) {
      const burstSize = config.throttleLimitMBps * 2;
      const earned = dt * config.throttleLimitMBps;
      s.tokenBucket = Math.min(burstSize, s.tokenBucket + earned);

      // Max speed we can draw this tick is capped by available tokens
      const maxDraw = s.tokenBucket / dt;
      availableMBps = Math.min(availableMBps, maxDraw);
    }

    const ranges = s.ranges;
    const activeIndices = [];
    for (let i = 0; i < ranges.length; i++) {
      if (s.partDones[i] < ranges[i].length) {
        activeIndices.push(i);
      }
    }

    if (activeIndices.length === 0) {
      // All parts completed!
      s.stage = "finalize";
      s.published = true;
      s.partSpeeds = ranges.map(() => 0);
      return s;
    }

    const activeCount = config.serverMode === "no_range" ? 1 : activeIndices.length;
    const speedPerWorker = availableMBps / activeCount;
    let actualMBThisTick = 0;

    for (let i = 0; i < ranges.length; i++) {
      if (activeIndices.includes(i) && (config.serverMode !== "no_range" || i === 0)) {
        const remaining = ranges[i].length - s.partDones[i];
        const added = Math.min(remaining, speedPerWorker * dt);
        s.partDones[i] += added;
        s.partSpeeds[i] = added / dt;
        actualMBThisTick += added;
      } else {
        s.partSpeeds[i] = 0;
      }
    }

    if (isLimited) {
      s.tokenBucket = Math.max(0, s.tokenBucket - actualMBThisTick);
    }

    // Update 1 MB block hashes
    const totalDownloaded = s.partDones.reduce((sum, d) => sum + d, 0);
    s.committedBlocks = Math.floor(totalDownloaded / BLOCK_SIZE_MB);

    // Periodic Checkpoint (every 5 seconds)
    if (s.time - s.lastCheckpointTime >= config.checkpointIntervalS) {
      s.lastCheckpointTime = s.time;
      s.checkpointsFlushed += 1;
    }

    // Check completion
    const allDone = s.partDones.every((d, i) => d >= ranges[i].length - 0.001);
    if (allDone) {
      s.stage = "finalize";
      s.published = true;
      s.partSpeeds = ranges.map(() => 0);
    }
  }

}
