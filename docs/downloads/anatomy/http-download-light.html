  }

  function probeArm(progress = 0) {
    // Spring-loaded probe feeler arm (bytes 0-1)
    const { PROBE_PIVOT, X0, BILLET_Y, BILLET_Z, BILLET_R } = W;
    const out = [];

    // Pivot stanchion
    out.push(S(k.cylinder(PROBE_PIVOT.x, PROBE_PIVOT.y, 2.2, 0, PROBE_PIVOT.z + 4, P, 16), { tone: "mid" }));

    // Feeler arm reaching from pivot toward billet edge at X0
    // In rest position (progress=0), tip is lifted; when active (progress > 0), tip drops to touch billet
    const contactZ = BILLET_Z + BILLET_R + (1 - progress) * 6;
    const targetPt = [X0 + 1, BILLET_Y, contactZ];
    const pivotTop = [PROBE_PIVOT.x, PROBE_PIVOT.y, PROBE_PIVOT.z + 3];

    out.push(L(k.pathOf([at(pivotTop), at(targetPt)]), { tone: "hi", style: "stroke-width:1.4" }));
    out.push(D([at(targetPt)], { size: 0.9, tone: progress > 0 ? "hi" : "mid" }));

    return out.join("");
  }

  function checkpointUnit(flushedCount = 0, isFlushing = false) {
    // 1 MB Block Checkpoint ratcheting drum & punch solenoid
    const { DRUM_X, DRUM_Y, DRUM_Z, DRUM_R, DRUM_W } = W;
    const out = [];

    // Base bracket
    const bracket = { x: DRUM_X - 4, y: DRUM_Y - 6, w: DRUM_W + 8, d: 14, r: 1.5 };
    out.push(S(box(bracket, 0, 4, 2, 0.4), { tone: "mid" }));

    // 4-wheel odometer register drum
    out.push(S(k.cylinderAlongX(DRUM_X, DRUM_X + DRUM_W, DRUM_Y, DRUM_Z + DRUM_R, DRUM_R, P, 20), { tone: "mid" }));

    // Wheel divider rings
    for (let i = 1; i < 4; i++) {
      const rx = DRUM_X + i * (DRUM_W / 4);
      out.push(L(k.ring(rx, DRUM_Y, DRUM_R + 0.2, DRUM_Z + DRUM_R, P, 16), { tone: "lo" }));
    }

    // Overhead punch solenoid plunger
    const solX = DRUM_X + DRUM_W / 2;
    const plungerZ = isFlushing ? DRUM_Z + DRUM_R + 8 : DRUM_Z + DRUM_R + 12;
    out.push(S(k.cylinder(solX, DRUM_Y, 4, DRUM_Z + DRUM_R + 4, 10, P, 16), { tone: "lo" }));
    out.push(S(k.cylinder(solX, DRUM_Y, 2.2, plungerZ, 4, P, 16), { tone: "hi" }));

    // Cartridge drawer representing .checkpoint file store
    const cart = { x: DRUM_X + 2, y: DRUM_Y + 7, w: DRUM_W - 4, d: 5, r: 0.6 };
    out.push(S(box(cart, 2, 4.5, 2, 0.2), { tone: "hi" }));
    out.push(D([at([solX, DRUM_Y + 9.5, 4.2])], { size: 0.5, tone: "lo" }));

    return out.join("");
  }

  function publicationChuck(isPublished = false) {
    // Publication Chuck & Cam Release Lever (atomic rename)
    const { CHUCK_X, CHUCK_Y, CHUCK_Z, CHUCK_R } = W;
    const out = [];

    // Outer heavy three-jaw chuck collar
    out.push(S(k.cylinderAlongX(CHUCK_X, CHUCK_X + 12, CHUCK_Y, CHUCK_Z, CHUCK_R, P, 24), { tone: "mid" }));

    // Three chuck jaw keys
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + (isPublished ? 0.5 : 0);
      const jx = CHUCK_X + 6;
      const jy = CHUCK_Y + Math.sin(a) * (CHUCK_R - 3);
      const jz = CHUCK_Z + Math.cos(a) * (CHUCK_R - 3);
      out.push(D([at([jx, jy, jz])], { size: 0.9, tone: "hi" }));
    }

    // Cam lock release handle
    // Lever is upright (Z+) while file is in .senpwai-part staging, drops forward when published
    const leverLen = 14;
    const leverAngle = isPublished ? 0.3 : 1.4; // radians from horizontal
    const lx = CHUCK_X + 6;
    const ly = CHUCK_Y + Math.cos(leverAngle) * leverLen;
    const lz = CHUCK_Z + Math.sin(leverAngle) * leverLen;

    out.push(L(k.pathOf([at([lx, CHUCK_Y, CHUCK_Z]), at([lx, ly, lz])]), { tone: "hi", style: "stroke-width:1.8" }));
    out.push(D([at([lx, ly, lz])], { size: 1.4, tone: isPublished ? "hi" : "mid" }));

    return out.join("");
  }

  function spindleCarriage(x, isStreaming = false, isBusy = false) {
    // Single motorized Range Worker carriage
    const { RAIL_Y_BACK, RAIL_Y_FRONT, RAIL_Z, BILLET_Y, BILLET_Z, BILLET_R } = W;
    const out = [];

    // Carriage saddle spanning between twin rails
    const saddle = { x: x - 6, y: RAIL_Y_BACK - 2, w: 12, d: RAIL_Y_FRONT - RAIL_Y_BACK + 4, r: 1.5 };
    out.push(S(box(saddle, RAIL_Z - 3, 7, 2, 0.4), { tone: "mid" }));

    // Bushing sleeves around back and front guide rods
    out.push(S(k.cylinderAlongX(x - 6.5, x + 6.5, RAIL_Y_BACK, RAIL_Z, 3.4, P, 16), { tone: "lo" }));
    out.push(S(k.cylinderAlongX(x - 6.5, x + 6.5, RAIL_Y_FRONT, RAIL_Z, 3.4, P, 16), { tone: "lo" }));

    // Center vertical tool spindle housing
    out.push(S(k.cylinder(x, BILLET_Y, 4.2, RAIL_Z + 4, 8, P, 16), { tone: "lo" }));

    // Top status indicator LED lamp
    // Cyan / bright if actively streaming data, Amber / mid if connecting / busy, Faint if idle
    const lampTone = isStreaming ? "hi" : (isBusy ? "mid" : "lo");
    out.push(S(k.cylinder(x, BILLET_Y, 1.8, RAIL_Z + 12, 2.5, P, 12), { tone: lampTone }));
    out.push(D([at([x, BILLET_Y, RAIL_Z + 14.5])], { size: 1.1, tone: lampTone }));

    // Downward burnishing stylus contacting billet
    const stylusZ = BILLET_Z + BILLET_R;
    out.push(D([at([x, BILLET_Y, RAIL_Z - 3])], { size: 0.6, tone: "lo" }));
    out.push(L(k.pathOf([at([x, BILLET_Y, RAIL_Z - 3]), at([x, BILLET_Y, stylusZ])]), { tone: "hi", style: "stroke-width:1.2" }));
    out.push(D([at([x, BILLET_Y, stylusZ])], { size: 0.8, tone: isStreaming ? "hi" : "lo" }));

    // Lower interlock rocker arm coupling to serialized spline shaft (_OffsetFileWriter)
    out.push(L(k.pathOf([at([x, BILLET_Y, stylusZ]), at([x, BILLET_Y, 6])]), { tone: "lo", style: "stroke-width:1" }));
    out.push(D([at([x, BILLET_Y, 6])], { size: 0.6, tone: "lo" }));

    return out.join("");
  }

  return {
    governor,
    manometer,
    probeArm,
    checkpointUnit,
    publicationChuck,
    spindleCarriage,
  };
}

// Dynamic SVG shapes that change every frame: the billet sectors and partition bands.

function billetSvg(kit, P, ranges, partDones, totalLength) {
  const { X0, FILE_SPAN, BILLET_Y, BILLET_Z, BILLET_R } = W;
  const out = [];

  const scale = totalLength > 0 ? FILE_SPAN / totalLength : 1;

  for (let i = 0; i < ranges.length; i++) {
    const r = ranges[i];
    const done = partDones[i] || 0;

    const xStart = X0 + r.start * scale;
    const xEnd = X0 + r.end * scale;
    const xDone = Math.min(xEnd, xStart + done * scale);

    // 1. Downloaded & verified portion (burnished high tone)
    if (xDone > xStart + 0.1) {
      out.push(
        kit.solidSvg(
          kit.cylinderAlongX(xStart, xDone, BILLET_Y, BILLET_Z, BILLET_R, P, 20),
          { tone: "hi", stroke: "currentColor" },
        ),
      );
    }

    // 2. Pre-allocated raw portion (darker tone)
    if (xEnd > xDone + 0.1) {
      out.push(
        kit.solidSvg(
          kit.cylinderAlongX(xDone, xEnd, BILLET_Y, BILLET_Z, BILLET_R, P, 20),
          { tone: "lo", opacity: 0.5 },
        ),
      );
    }

    // 3. Sector partition boundary ring
    if (i > 0) {
      out.push(
        kit.lineSvg(
          kit.ring(xStart, BILLET_Y, BILLET_R + 0.4, BILLET_Z, P, 16),
          { tone: "lo", style: "stroke-dasharray: 2 1.5; stroke-width: 0.8" },
        ),
      );
    }
  }

  return out.join("");
}

function rulerCursorSvg(kit, P, totalProgressRatio) {
  const { RULER_X0, FILE_SPAN, RULER_Y, RULER_Z, RULER_H } = W;
  const curX = RULER_X0 + totalProgressRatio * FILE_SPAN;
  const topZ = RULER_Z + RULER_H + 0.2;

  // Small brass cursor indicator riding along the ruler
  const pt0 = kit.iso([curX, RULER_Y + 0.5, topZ], P);
  const pt1 = kit.iso([curX, RULER_Y + 5.5, topZ], P);
  const pt2 = kit.iso([curX - 1.2, RULER_Y + 7, topZ + 2], P);
  const pt3 = kit.iso([curX + 1.2, RULER_Y + 7, topZ + 2], P);

  return [
    `<path class="iso-line" data-tone="hi" d="${kit.pathOf([pt0, pt1])}" style="stroke-width:1.4"/>`,
    `<polygon class="iso-top" points="${pt1[0]},${pt1[1]} ${pt2[0]},${pt2[1]} ${pt3[0]},${pt3[1]}"/>`,
  ].join("");
}

const P = {"origin":[330.0076852229627,160.06725591129302],"scale":0.813531430813284,"azimuth":44,"elevation":28};
const PRESETS = {"standard":{"fileSizeMB":240,"workers":4,"networkSpeedMBps":16,"throttleLimitMBps":0,"serverMode":"range_etag"},"throttled":{"fileSizeMB":240,"workers":4,"networkSpeedMBps":16,"throttleLimitMBps":4,"serverMode":"range_etag"},"legacy":{"fileSizeMB":240,"workers":4,"networkSpeedMBps":16,"throttleLimitMBps":0,"serverMode":"no_range"},"dense":{"fileSizeMB":320,"workers":8,"networkSpeedMBps":28,"throttleLimitMBps":0,"serverMode":"range_etag"},"stale":{"fileSizeMB":240,"workers":4,"networkSpeedMBps":16,"throttleLimitMBps":0,"serverMode":"range_etag"},"quick":{"fileSizeMB":60,"workers":2,"networkSpeedMBps":20,"throttleLimitMBps":0,"serverMode":"range_etag"}};
// Interactive browser runtime for HTTP Download Engine.
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const q = (sel) => svg.querySelector(sel);
const all = (sel, root = svg) => [...root.querySelectorAll(sel)];

const billetGroup = q('[data-part="billet"]');
const probeGroup = q('[data-part="probe"]');
const chuckGroup = q('[data-part="chuck"]');
const cursorGroup = q('[data-part="cursor"]');
const spindlesGroup = q('[data-key="spindles"]');
const governorGroup = q('[data-key="governor"]');
const manometerGroup = q('[data-key="manometer"]');
const checkpointGroup = q('[data-key="checkpoint"]');
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

const d = drawOf(P);
const m = instrumentsOf(d);

let cfg = { ...DEFAULTS };
let s = createInitialState(cfg);
let speed = 1, clock = 0, next = 0, touring = !still.matches;
let frame = 0, last = 0, visible = false, statsAt = 0;

// The tour showcases the complete engine lifecycle:
const TOUR = [
  [8, () => { cfg.throttleLimitMBps = 6; s.tokenBucket = 6; if (ex) ex.set("throttleLimitMBps", 6); }],
  [16, () => { s.checkpointsFlushed += 1; s.lastCheckpointTime = s.time; }],
  [22, () => { cfg.throttleLimitMBps = 0; if (ex) ex.set("throttleLimitMBps", 0); }],
  [30, () => resetEngine()],
];
const LOOP = 32;

function resetEngine() {
  s = createInitialState(cfg);
  clock = 0;
  next = 0;
  rebuildSpindles();
}

function rebuildSpindles() {
  // Re-generate spindle heads whenever worker count changes
  const { X0, FILE_SPAN } = W;
  const scale = cfg.fileSizeMB > 0 ? FILE_SPAN / cfg.fileSizeMB : 1;
  const heads = s.ranges.map((r, i) => {
    const done = s.partDones[i] || 0;
    const xPos = X0 + (r.start + done) * scale;
    return `<g data-part="spindle" data-i="${i}">${m.spindleCarriage(xPos, false, false)}</g>`;
  });
  const existingHeads = all('[data-part="spindle"]', spindlesGroup);
  existingHeads.forEach((el) => el.remove());
  spindlesGroup.insertAdjacentHTML("beforeend", heads.join(""));
}

function phaseInfo() {
  if (s.stage === "probe") return ["probing (0-1)", "wait"];
  if (s.stage === "allocate") return ["allocating", "wait"];
  if (s.stage === "stream") {
    return cfg.throttleLimitMBps > 0 ? ["throttled", "ok"] : ["streaming", "ok"];
  }
  if (s.stage === "paused") return ["paused", "idle"];
  if (s.stage === "finalize") return ["completed", "ok"];
  if (s.stage === "error") return ["interrupted", "alert"];
  return ["idle", "idle"];
}

function report() {
  const { totalDownloaded, totalLength, progressRatio, activeWorkersCount, currentSpeed, committedBlocks } = derive(cfg, s);
  
  ex.setStats({
    downloaded: `${totalDownloaded.toFixed(1)} / ${totalLength} MB (${(progressRatio * 100).toFixed(0)}%)`,
    speed: `${currentSpeed.toFixed(1)} MB/s`,
    workers: `${activeWorkersCount} of ${s.ranges.length}`,
    tokens: cfg.throttleLimitMBps > 0 ? `${s.tokenBucket.toFixed(1)} MB` : "Unmetered",
    blocks: `${committedBlocks} (${committedBlocks} MB)`,
    checkpoints: `${s.checkpointsFlushed} flushes`,
    etag: s.etag ? `${s.etag} (Locked)` : "None (200)",
    phase: s.published ? "Published" : s.stage,
    size: `${totalLength} MB`,
  });

  const [word, tone] = phaseInfo();
  ex.setPhase(word, tone);
  ex.setStage(s.stage);
  ex.setPlaying(s.stage !== "paused" && s.stage !== "finalize");
  ex.setTouring(touring);

  const text = `${word} · ${totalDownloaded.toFixed(1)} / ${totalLength} MB · ${currentSpeed.toFixed(1)} MB/s`;
  if (readout.textContent !== text) readout.textContent = text;
}

function draw() {
  const { totalDownloaded, totalLength, progressRatio } = derive(cfg, s);
  const { X0, FILE_SPAN } = W;
  const scale = totalLength > 0 ? FILE_SPAN / totalLength : 1;

  // 1. Dynamic Billet
  billetGroup.innerHTML = billetSvg(kit, P, s.ranges, s.partDones, totalLength);

  // 2. Vernier Ruler Cursor
  cursorGroup.innerHTML = rulerCursorSvg(kit, P, progressRatio);

  // 3. Spindle Carriages
  const spindleEls = all('[data-part="spindle"]', spindlesGroup);
  s.ranges.forEach((r, i) => {
    if (!spindleEls[i]) return;
    const done = s.partDones[i] || 0;
    const xPos = X0 + (r.start + done) * scale;
    const isStreaming = s.stage === "stream" && (s.partSpeeds[i] || 0) > 0.05;
    const isBusy = s.stage === "stream" && done < r.length;
    spindleEls[i].innerHTML = m.spindleCarriage(xPos, isStreaming, isBusy);
  });

  // 4. Feeler Probe Arm
  probeGroup.innerHTML = m.probeArm(s.probeProgress);

  // 5. Publication Chuck
  chuckGroup.innerHTML = m.publicationChuck(s.published);

  // 6. Governor Sight Glass Float
  const tokenRatio = cfg.throttleLimitMBps > 0
    ? Math.min(1, s.tokenBucket / (cfg.throttleLimitMBps * 2))
    : 0.65;
  governorGroup.innerHTML = m.governor(tokenRatio);

  // 7. Manometer Needle
  manometerGroup.innerHTML = m.manometer(cfg.serverMode !== "no_range", s.etagMatched);

  // 8. Checkpoint Solenoid Plunger
  const isFlushing = (s.time - s.lastCheckpointTime) < 0.35;
  checkpointGroup.innerHTML = m.checkpointUnit(s.checkpointsFlushed, isFlushing);
}

function advance(dt) {
  if (touring) {
    clock += dt;
    while (next < TOUR.length && clock >= TOUR[next][0]) TOUR[next++][1]();
    if (clock >= LOOP) { clock = 0; next = 0; }
  }
  s = step(s, dt, cfg);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const n = Math.ceil(speed);
  for (let i = 0; i < n; i++) advance((dt * speed) / n);
  draw();
  if (now - statsAt > 120) { statsAt = now; report(); }
  frame = visible ? requestAnimationFrame(tick) : 0;
}

const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };

function steer(action) {
  touring = false;
  action();
  report();
  run();
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("keydown", (event) => {
  if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    steer(() => {
      s.stage = s.stage === "paused" ? "stream" : "paused";
    });
  } else if (event.key === "Escape") {
    event.preventDefault();
    steer(() => resetEngine());
  }
});

const LIVE_KEYS = new Set(["networkSpeedMBps", "throttleLimitMBps", "checkpointIntervalS"]);

const ex = Explorer.mount(document.querySelector("[data-explorer]"), {
  presets: PRESETS,
  onChange(changed, values) {
    const isRestart = Object.keys(changed).some((name) => !LIVE_KEYS.has(name));
    cfg = { ...cfg, ...values };
    steer(() => {
      if (isRestart) {
        resetEngine();
      }
    });
  },
  onAction(act, value) {
    if (act === "speed") { speed = value; return; }
    if (act === "tour") {
      touring = !touring;
      clock = 0; next = 0;
      if (touring) resetEngine();
      report();
      return run();
    }
    const acts = {
      play: () => { s.stage = s.stage === "paused" ? "stream" : "paused"; },
      restart: () => resetEngine(),
      togglePause: () => { s.stage = s.stage === "paused" ? "stream" : "paused"; },
      flushCheckpoint: () => {
        s.checkpointsFlushed += 1;
        s.lastCheckpointTime = s.time;
      },
      dropWorker: () => {
        // Transient interruption of active worker
        if (s.partSpeeds.length > 0) {
          s.partSpeeds[0] = 0;
        }
      },
      restartZero: () => resetEngine(),
    };
    if (acts[act]) steer(acts[act]);
  },
});

Explorer.legend(document.querySelector(".ex-legend ul"), stage);

rebuildSpindles();
draw();
report();

}</script></body></html>
