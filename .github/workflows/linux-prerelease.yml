name: Linux prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version embedded in the test AppImages
        required: true
        default: "3.0.0"
        type: string
      build_number:
        description: Monotonically increasing test build number
        required: true
        default: "30001"
        type: string
      release_tag:
        description: GitHub prerelease tag receiving both AppImages
        required: true
        default: "linux-prerelease-3.0.0-30001"
        type: string
      wpe_version:
        description: WPE WebKit SDK/runtime version
        required: true
        default: "2.50.4"
        type: string
      wpe_sdk_tag:
        description: Prerelease tag containing the matching WPE assets
        required: true
        default: "wpe-sdk-2.50.4"
        type: string
      notes:
        description: Release notes shown by the updater
        required: true
        default: "Linux prerelease for AppImage and updater testing."
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: linux-prerelease-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.display_architecture }} AppImage
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            display_architecture: x86_64
            flutter_architecture: x64
            wpe_architecture: x86_64
            appimage_architecture: x86_64
            manifest_architecture: x64
          - runner: ubuntu-24.04-arm
            display_architecture: aarch64
            flutter_architecture: arm64
            wpe_architecture: aarch64
            appimage_architecture: aarch64
            manifest_architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      WPE_VERSION: ${{ inputs.wpe_version }}
      WPE_SDK_TAG: ${{ inputs.wpe_sdk_tag }}
      WPE_SDK_REPOSITORY: SenZmaKi/wpe-webkit-sdk-prebuilt-binaries
      FLUTTER_ARCHITECTURE: ${{ matrix.flutter_architecture }}
      WPE_ARCHITECTURE: ${{ matrix.wpe_architecture }}
      APPIMAGE_ARCHITECTURE: ${{ matrix.appimage_architecture }}
      PRERELEASE_MANIFEST_URL: https://senzmaki.github.io/Senpwai/update-manifest-prerelease.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate manual inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$WPE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$WPE_SDK_TAG" =~ ^wpe-sdk-[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install Linux packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            file libayatana-appindicator3-dev libgtk-3-dev libsecret-1-dev \
            libsoup-3.0-dev libwayland-dev pkg-config

      - name: Install the pinned WPE SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_name="Senpwai-WPE-SDK-${WPE_VERSION}-linux-${WPE_ARCHITECTURE}.tar.xz"
          sdk_dir="$RUNNER_TEMP/wpe-sdk"
          mkdir -p "$sdk_dir"
          gh release download "$WPE_SDK_TAG" \
            --repo "$WPE_SDK_REPOSITORY" \
            --pattern "$sdk_name*" \
            --dir "$sdk_dir"
          (cd "$sdk_dir" && sha256sum --check "$sdk_name.sha256")
          sudo tar -xJf "$sdk_dir/$sdk_name" -C /
          sudo ldconfig
          test "$(pkg-config --modversion wpe-webkit-2.0)" = "$WPE_VERSION"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build the prerelease bundle
        shell: bash
        run: |
          set -euo pipefail
          flutter build linux \
            --release \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=UPDATE_MANIFEST_URL="$PRERELEASE_MANIFEST_URL"

      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage_name="Senpwai-${VERSION}-${APPIMAGE_ARCHITECTURE}.AppImage"
          runtime_name="Senpwai-WPE-Runtime-${WPE_VERSION}-linux-${WPE_ARCHITECTURE}.tar.xz"
          bundle_dir="build/linux/${FLUTTER_ARCHITECTURE}/release/bundle"
          package_dir="$RUNNER_TEMP/appimage"
          app_dir="$package_dir/AppDir"
          runtime_dir="$RUNNER_TEMP/wpe-runtime"
          tool="$package_dir/appimagetool-${APPIMAGE_ARCHITECTURE}.AppImage"
          release_dir="$GITHUB_WORKSPACE/release-assets"
          test -d "$bundle_dir"
          mkdir -p "$app_dir/usr/bin" "$runtime_dir/root" "$release_dir"
          cp -a "$bundle_dir/." "$app_dir/usr/bin/"
          gh release download "$WPE_SDK_TAG" \
            --repo "$WPE_SDK_REPOSITORY" \
            --pattern "$runtime_name*" \
            --dir "$runtime_dir"
          (cd "$runtime_dir" && sha256sum --check "$runtime_name.sha256")
          tar -xJf "$runtime_dir/$runtime_name" -C "$runtime_dir/root"
          mkdir -p "$app_dir/usr/bin/lib" "$app_dir/usr/libexec" "$app_dir/usr/share"
          cp -a "$runtime_dir/root/usr/local/lib/." "$app_dir/usr/bin/lib/"
          cp -a "$runtime_dir/root/usr/local/libexec/." "$app_dir/usr/libexec/"
          cp -a "$runtime_dir/root/usr/local/share/." "$app_dir/usr/share/"
          cp linux/com.senpwai.app.desktop "$app_dir/com.senpwai.app.desktop"
          cp assets/images/senpwai-icon.png "$app_dir/com.senpwai.app.png"
          printf '%s\n' \
            '#!/bin/sh' \
            'export LD_LIBRARY_PATH="$APPDIR/usr/bin/lib:${LD_LIBRARY_PATH:-}"' \
            'export WEBKIT_EXEC_PATH="$APPDIR/usr/libexec/wpe-webkit-2.0"' \
            'export XDG_DATA_DIRS="$APPDIR/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"' \
            'exec "$APPDIR/usr/bin/senpwai" "$@"' \
            > "$app_dir/AppRun"
          chmod 755 "$app_dir/AppRun"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${APPIMAGE_ARCHITECTURE}.AppImage" \
            --output "$tool"
          chmod 755 "$tool"
          ARCH="$APPIMAGE_ARCHITECTURE" APPIMAGE_EXTRACT_AND_RUN=1 \
            "$tool" "$app_dir" "$release_dir/$appimage_name"
          chmod 755 "$release_dir/$appimage_name"
          file "$release_dir/$appimage_name" | grep -q 'ELF 64-bit'
          (cd "$release_dir" && sha256sum "$appimage_name" > "$appimage_name.sha256")

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-prerelease-${{ matrix.appimage_architecture }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Linux prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Download AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-prerelease-*
          path: release-assets
          merge-multiple: true

      - name: Build prerelease update manifest
        shell: bash
        run: |
          set -euo pipefail
          descriptor="$RUNNER_TEMP/linux-prerelease.json"
          manifest="$RUNNER_TEMP/update-manifest-prerelease.payload.json"
          artifacts='[]'
          for mapping in 'x86_64:x64' 'aarch64:arm64'; do
            appimage_architecture="${mapping%%:*}"
            manifest_architecture="${mapping##*:}"
            appimage_name="Senpwai-${VERSION}-${appimage_architecture}.AppImage"
            asset="${GITHUB_WORKSPACE}/release-assets/${appimage_name}"
            test -f "$asset"
            sha256sum --check "${asset}.sha256"
            artifacts="$(jq \
              --arg platform linux \
              --arg architecture "$manifest_architecture" \
              --arg path "$asset" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${appimage_name}" \
              '. + [{platform: $platform, architecture: $architecture, localPath: $path, url: $url}]' \
              <<<"$artifacts")"
          done
          jq -n \
            --arg version "$VERSION" \
            --argjson build "$BUILD_NUMBER" \
            --arg notes "$RELEASE_NOTES" \
            --argjson artifacts "$artifacts" \
            '{version: $version, build: $build, channel: "stable", mandatory: false, notes: $notes, artifacts: $artifacts}' \
            > "$descriptor"
          printf '%s\n' '{"schemaVersion":1,"releases":[]}' > "$manifest"
          cd source-directory/signer
          dart pub get
          dart run bin/build_update_feeds.dart \
            --release "$descriptor" \
            --manifest "$manifest" \
            --appcast "$RUNNER_TEMP/unused-appcast.xml"
          cp "$manifest" "$RUNNER_TEMP/update-manifest-prerelease.final.json"

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Senpwai Linux prerelease $VERSION+$BUILD_NUMBER" \
              --notes "$RELEASE_NOTES"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Build signed Pages content
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix website
          npm run build --prefix website
          mkdir -p site
          cp -R website/dist/. site/
          cd source-directory/signer
          dart run bin/sign.dart \
            --input ../source_directory.payload.json \
            --output ../../site/source-directory.json
          dart run bin/sign.dart \
            --input ../../update-manifest/update_manifest.payload.json \
            --output ../../site/update-manifest.json \
            --private-key-environment UPDATE_MANIFEST_PRIVATE_KEY
          dart run bin/sign.dart \
            --input "$RUNNER_TEMP/update-manifest-prerelease.final.json" \
            --output ../../site/update-manifest-prerelease.json \
            --private-key-environment UPDATE_MANIFEST_PRIVATE_KEY
        env:
          SOURCE_DIRECTORY_PRIVATE_KEY: ${{ secrets.SOURCE_DIRECTORY_PRIVATE_KEY }}
          UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy prerelease update manifest
        id: deployment
        uses: actions/deploy-pages@v4
