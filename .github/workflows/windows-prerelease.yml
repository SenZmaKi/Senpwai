name: Windows prerelease

on:
  push:
    branches:
      - v3.0.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Windows prerelease
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          version="${package_version%%+*}"
          if [[ "$package_version" == *+* ]]; then
            build_number="${package_version##*+}"
          else
            build_number=1
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          {
            echo "version=$version"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows ${{ matrix.architecture }} installer
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up Flutter
        if: matrix.architecture == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Set up Flutter from source
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterRoot = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git $flutterRoot
          "$flutterRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$flutterRoot\bin\flutter.bat" --version

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.architecture == 'arm64' && 'arm64' || 'amd64' }}

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build Windows release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter build windows --release `
            --build-name $env:APP_VERSION `
            --build-number $env:BUILD_NUMBER

          $bundle = "build\windows\$env:ARCHITECTURE\runner\Release"
          if (-not (Test-Path -LiteralPath "$bundle\senpwai.exe")) {
            throw "Windows bundle was not created at $bundle"
          }
          "WINDOWS_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify native architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedMachine = if ($env:ARCHITECTURE -eq 'arm64') { 'ARM64' } else { 'x64' }
          foreach ($binary in @(
            "$env:WINDOWS_BUNDLE\senpwai.exe",
            "$env:WINDOWS_BUNDLE\torrent-rasterbar.dll"
          )) {
            if (-not (Test-Path -LiteralPath $binary)) {
              throw "Required binary is missing: $binary"
            }
            $headers = dumpbin /headers $binary
            if (-not ($headers | Select-String -SimpleMatch "machine ($expectedMachine)")) {
              throw "$binary is not a native $expectedMachine binary"
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress --limit-output

      - name: Compile unsigned installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc /Qp "/DAppVersion=$env:APP_VERSION" "/DAppArchitecture=$env:ARCHITECTURE" scripts\setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          $releaseDir = 'build\release\windows'
          $installerName = "Senpwai-windows-$env:ARCHITECTURE-setup.exe"
          $installer = Join-Path $releaseDir $installerName
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not created: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: Test installer lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Resolve-Path "build\release\windows\Senpwai-windows-$env:ARCHITECTURE-setup.exe"
          $testDir = Join-Path $env:RUNNER_TEMP "Senpwai-$env:ARCHITECTURE-installer-test"
          if (Test-Path -LiteralPath $testDir) {
            throw "Installer test directory already exists: $testDir"
          }

          $install = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/NOICONS',
            "/DIR=$testDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)"
          }

          $installedExe = Join-Path $testDir 'senpwai.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) {
            throw 'The installed Senpwai executable is missing'
          }
          $versionInfo = (Get-Item -LiteralPath $installedExe).VersionInfo
          if ($versionInfo.CompanyName -ne 'com.senpwai.app') {
            throw "Unexpected CompanyName: $($versionInfo.CompanyName)"
          }

          $uninstaller = Join-Path $testDir 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/KEEPAPPDATA'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $installedExe)) {
            throw 'The installer lifecycle test did not uninstall Senpwai cleanly'
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.architecture }}
          path: |
            build/release/windows/Senpwai-windows-${{ matrix.architecture }}-setup.exe
            build/release/windows/Senpwai-windows-${{ matrix.architecture }}-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish-prerelease:
    name: Publish Windows prerelease
    needs: [prepare, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      PRERELEASE_TAG: v${{ needs.prepare.outputs.version }}-windows-preview.${{ github.run_number }}
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v8
        with:
          pattern: release-windows-*
          path: release-assets
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check Senpwai-windows-x64-setup.exe.sha256
          sha256sum --check Senpwai-windows-arm64-setup.exe.sha256

      - name: Create Windows prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$PRERELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Senpwai $VERSION Windows preview" \
            --notes "Unsigned Windows preview installers for native x64 and ARM64. Windows SmartScreen may require More info → Run anyway. Build $BUILD_NUMBER is published to the signed update feed for update-flow testing."

      - name: Add workflow summary
        shell: bash
        run: |
          {
            echo "## Senpwai $VERSION Windows preview"
            echo
            echo "Published unsigned native x64 and ARM64 Inno Setup installers."
            echo
            echo "Tag: \`$PRERELEASE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-update-feed:
    name: Deploy Windows prerelease update feed
    needs: [prepare, publish-prerelease]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      PRERELEASE_TAG: v${{ needs.prepare.outputs.version }}-windows-preview.${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Windows installers
        uses: actions/download-artifact@v8
        with:
          pattern: release-windows-*
          path: release-assets
          merge-multiple: true

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build Windows update manifest
        shell: bash
        run: |
          set -euo pipefail
          signed_manifest="$RUNNER_TEMP/current-update-manifest.json"
          manifest="$RUNNER_TEMP/update-manifest.payload.json"
          descriptor="$RUNNER_TEMP/windows-release.json"
          curl --fail --location --retry 4 --retry-all-errors \
            https://senzmaki.github.io/Senpwai/update-manifest.json \
            --output "$signed_manifest"
          node -e \
            'const fs=require("fs"); const envelope=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); fs.writeFileSync(process.argv[2], Buffer.from(envelope.payload, "base64url"));' \
            "$signed_manifest" "$manifest"

          artifacts='[]'
          for architecture in x64 arm64; do
            installer_name="Senpwai-windows-${architecture}-setup.exe"
            asset="$GITHUB_WORKSPACE/release-assets/$installer_name"
            test -f "$asset"
            (
              cd "$(dirname "$asset")"
              sha256sum --check "${installer_name}.sha256"
            )
            artifacts="$(jq \
              --arg platform windows \
              --arg architecture "$architecture" \
              --arg path "$asset" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${PRERELEASE_TAG}/${installer_name}" \
              '. + [{platform: $platform, architecture: $architecture, localPath: $path, url: $url}]' \
              <<<"$artifacts")"
          done
          jq -n \
            --arg version "$VERSION" \
            --argjson build "$BUILD_NUMBER" \
            --arg notes "Senpwai $VERSION Windows update-flow preview" \
            --argjson artifacts "$artifacts" \
            '{version: $version, build: $build, channel: "stable", mandatory: false, notes: $notes, artifacts: $artifacts}' \
            > "$descriptor"

          cd source-directory/signer
          dart pub get
          dart run bin/build_update_feeds.dart \
            --release "$descriptor" \
            --manifest "$manifest" \
            --appcast "$RUNNER_TEMP/unused-appcast.xml"

      - name: Build and sign Pages content
        shell: bash
        env:
          SOURCE_DIRECTORY_PRIVATE_KEY: ${{ secrets.SOURCE_DIRECTORY_PRIVATE_KEY }}
          UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          npm ci --prefix website
          npm run astro --prefix website -- check
          npm run --prefix website build
          mkdir -p site
          cp -R website/dist/. site/
          cd source-directory/signer
          dart run bin/sign.dart \
            --input ../source_directory.payload.json \
            --output ../../site/source-directory.json
          dart run bin/sign.dart \
            --input "$RUNNER_TEMP/update-manifest.payload.json" \
            --output ../../site/update-manifest.json \
            --private-key-environment UPDATE_MANIFEST_PRIVATE_KEY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy signed Windows update manifest
        id: deployment
        uses: actions/deploy-pages@v5
