name: Deploy source directory

on:
  push:
    branches: [master, v3.0.0]
    paths:
      - website/**
      - source-directory/**
      - update-manifest/**
      - .github/workflows/deploy-source-directory.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: dart pub get
        working-directory: source-directory/signer
      - run: npm ci
        working-directory: website
      - run: npm run astro -- check
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: |
          mkdir -p site
          cp -R website/dist/. site/
      - run: |
          dart run bin/sign.dart \
            --input ../source_directory.payload.json \
            --output ../../site/source-directory.json
        env:
          SOURCE_DIRECTORY_PRIVATE_KEY: ${{ secrets.SOURCE_DIRECTORY_PRIVATE_KEY }}
        working-directory: source-directory/signer
      - run: |
          dart run bin/sign.dart \
            --input ../../update-manifest/update_manifest.payload.json \
            --output ../../site/update-manifest.json
          cp ../../update-manifest/appcast.xml ../../site/appcast.xml
        env:
          SOURCE_DIRECTORY_PRIVATE_KEY: ${{ secrets.SOURCE_DIRECTORY_PRIVATE_KEY }}
        working-directory: source-directory/signer
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
