name: Release

on:
  schedule:
    # 05:57 Africa/Nairobi, matching Sentorr.
    - cron: "57 2 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || 'nightly' }}
  cancel-in-progress: false

jobs:
  changes:
    name: Check for unreleased nightly commits
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Compare with latest published nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r '[.[][] | select(.draft == false) | select(.tag_name | contains("-nightly."))] | sort_by(.published_at) | last | .tag_name // empty')"
          if [[ -z "$latest_tag" ]]; then
            echo "No published nightly exists; creating the first one."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          encoded_tag="$(jq -rn --arg tag "$latest_tag" '$tag | @uri')"
          released_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$encoded_tag" --jq .sha)"
          if [[ "$released_sha" == "$GITHUB_SHA" ]]; then
            echo "Commit $GITHUB_SHA is already published as $latest_tag; skipping nightly."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Commit $GITHUB_SHA differs from $latest_tag ($released_sha); releasing nightly."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    name: Release quality checks
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: quality
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Match tag to pubspec version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          version="${package_version%%+*}"
          build_number="${package_version##*+}"
          expected_tag="v${version}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "pubspec version must be a stable or prerelease SemVer version" >&2
            exit 64
          fi
          if [[ ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "pubspec build number must be a positive integer" >&2
            exit 64
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 64
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$(git ls-remote origin refs/heads/master | cut -f1)" != "$GITHUB_SHA" ]]; then
              echo "Release tags must point to the current master commit" >&2
              exit 64
            fi
            test -s "release-notes/${version}.md"
          elif [[ "$GITHUB_REF_NAME" != "master" ]]; then
            echo "Nightly releases must run from master" >&2
            exit 64
          fi

          prerelease=false
          channel=stable
          if [[ "$version" == *-* ]]; then
            prerelease=true
            channel=prerelease
          fi

          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            version="${version%%-*}-nightly.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            build_number="$(date +%s)"
            expected_tag="v${version}"
            prerelease=true
            channel=nightly
          fi

          if [[ "$channel" != nightly ]]; then
            # Android and Sparkle require increasing builds across beta/stable.
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | select(.tag_name | contains("-nightly.") | not) | select(.tag_name != "'"$expected_tag"'") | .assets[] | select(.name == "update-entry.json") | .url' \
              > "$RUNNER_TEMP/previous-update-entries.txt"
            while IFS= read -r entry_url; do
              [[ -n "$entry_url" ]] || continue
              previous_build="$(gh api "$entry_url" -H 'Accept: application/octet-stream' \
                --jq '[.releases[].build] | max')"
              if [[ ! "$previous_build" =~ ^[1-9][0-9]*$ || "$build_number" -le "$previous_build" ]]; then
                echo "Release build $build_number must exceed published build $previous_build" >&2
                exit 64
              fi
            done < "$RUNNER_TEMP/previous-update-entries.txt"
          fi

          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "tag=$expected_tag"
            echo "prerelease=$prerelease"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build universal macOS app
    needs: [prepare, quality]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      ZIP_NAME: Senpwai-macos-universal.zip
      DMG_NAME: Senpwai-macos-universal.dmg
      APP_NAME: ${{ needs.prepare.outputs.channel == 'nightly' && 'Senpwai Nightly' || 'Senpwai' }}
      APPCAST_NAME: ${{ needs.prepare.outputs.channel == 'nightly' && 'appcast-nightly.xml' || needs.prepare.outputs.prerelease == 'true' && 'appcast-prerelease.xml' || 'appcast.xml' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Apply nightly identity and branding
        if: needs.prepare.outputs.channel == 'nightly'
        run: |
          python -m pip install Pillow
          python tool/nightly/nightly_branding.py

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Configure and verify Sparkle feed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
            expected_feed="https://senpwai.com/${APPCAST_NAME}"
            /usr/libexec/PlistBuddy -c "Set :SUFeedURL $expected_feed" macos/Runner/Info.plist
          else
            expected_feed="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${APPCAST_NAME}"
          fi
          actual_feed="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' macos/Runner/Info.plist)"
          test "$actual_feed" = "$expected_feed"

      - name: Build ad-hoc-signed release app
        shell: bash
        run: |
          set -euo pipefail
          flutter build macos \
            --release \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define "UPDATE_CHANNEL=${{ needs.prepare.outputs.channel }}" \
            --dart-define "DISCORD_REPORT_WEBHOOK_URL=$DISCORD_REPORT_WEBHOOK_URL"

      - name: Verify and package macOS app
        shell: bash
        run: |
          set -euo pipefail
          built_app="build/macos/Build/Products/Release/senpwai.app"
          release_dir="build/release/macos"
          package_root="$RUNNER_TEMP/senpwai-package"
          dmg_root="$RUNNER_TEMP/senpwai-dmg"
          extracted_root="$RUNNER_TEMP/senpwai-extracted"
          app_executable="$built_app/Contents/MacOS/senpwai"
          torrent_framework="$built_app/Contents/Frameworks/torrent-rasterbar.framework/torrent-rasterbar"

          for binary in "$app_executable" "$torrent_framework"; do
            architectures="$(lipo -archs "$binary")"
            [[ " $architectures " == *" arm64 "* ]]
            [[ " $architectures " == *" x86_64 "* ]]
          done

          sh macos/scripts/verify_app_signature.sh "$built_app"
          mkdir -p "$release_dir" "$package_root" "$dmg_root" "$extracted_root"
          /usr/bin/ditto "$built_app" "$package_root/$APP_NAME.app"
          sh macos/scripts/verify_app_signature.sh "$package_root/$APP_NAME.app"

          /usr/bin/ditto \
            -c -k --sequesterRsrc --keepParent \
            "$package_root/$APP_NAME.app" \
            "$release_dir/$ZIP_NAME"
          /usr/bin/ditto -x -k "$release_dir/$ZIP_NAME" "$extracted_root"
          sh macos/scripts/verify_app_signature.sh "$extracted_root/$APP_NAME.app"

          /usr/bin/ditto "$package_root/$APP_NAME.app" "$dmg_root/$APP_NAME.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$dmg_root" \
            -format UDZO \
            -ov \
            "$release_dir/$DMG_NAME"
          hdiutil verify "$release_dir/$DMG_NAME"

      - name: Generate signed Sparkle appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          release_dir="build/release/macos"
          repository_root="$PWD"
          descriptor="$RUNNER_TEMP/macos-release.json"
          empty_manifest="$RUNNER_TEMP/empty-update-manifest.json"
          zip_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ZIP_NAME}"
          if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
            appcast_url="https://senpwai.com/${APPCAST_NAME}"
          else
            appcast_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${APPCAST_NAME}"
          fi

          jq -n \
            --arg version "$VERSION" \
            --argjson build "$BUILD_NUMBER" \
            --arg notes "Senpwai $VERSION" \
            --arg path "$repository_root/$release_dir/$ZIP_NAME" \
            --arg url "$zip_url" \
            '{
              version: $version,
              build: $build,
              channel: "stable",
              mandatory: false,
              notes: $notes,
              artifacts: [{
                platform: "macos",
                architecture: "universal",
                localPath: $path,
                url: $url
              }]
            }' > "$descriptor"
          printf '%s\n' '{"schemaVersion":1,"releases":[]}' > "$empty_manifest"

          cd source-directory/signer
          dart pub get --enforce-lockfile
          dart run bin/build_update_feeds.dart \
            --release "$descriptor" \
            --manifest "$empty_manifest" \
            --appcast "$repository_root/$release_dir/$APPCAST_NAME" \
            --appcast-link "$appcast_url"

          cd "$repository_root/$release_dir"
          shasum -a 256 "$ZIP_NAME" "$DMG_NAME" "$APPCAST_NAME" > SHA256SUMS.txt

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            build/release/macos/Senpwai-macos-universal.zip
            build/release/macos/Senpwai-macos-universal.dmg
            build/release/macos/${{ env.APPCAST_NAME }}
            build/release/macos/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build ${{ matrix.display_architecture }} Linux AppImage
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            display_architecture: x86_64
            flutter_from_source: false
            flutter_architecture: x64
            wpe_architecture: x86_64
            appimage_architecture: x86_64
          - runner: ubuntu-24.04-arm
            display_architecture: aarch64
            flutter_from_source: true
            flutter_architecture: arm64
            wpe_architecture: aarch64
            appimage_architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      WPE_VERSION: "2.50.4"
      WPE_RELEASE_TAG: wpe-sdk-2.50.4
      WPE_RELEASE_REPOSITORY: SenZmaKi/wpe-webkit-sdk-prebuilt-binaries
      FLUTTER_ARCHITECTURE: ${{ matrix.flutter_architecture }}
      WPE_ARCHITECTURE: ${{ matrix.wpe_architecture }}
      APPIMAGE_ARCHITECTURE: ${{ matrix.appimage_architecture }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        if: ${{ !matrix.flutter_from_source }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Set up Flutter from source
        if: ${{ matrix.flutter_from_source }}
        shell: bash
        run: |
          set -euo pipefail
          flutter_root="$RUNNER_TEMP/flutter"
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$flutter_root"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
          "$flutter_root/bin/flutter" --version

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            file libayatana-appindicator3-dev libgtk-3-dev libsecret-1-dev \
            libsoup-3.0-dev libwayland-dev pkg-config

      - name: Install pinned WPE SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_name="Senpwai-WPE-SDK-${WPE_VERSION}-linux-${WPE_ARCHITECTURE}.tar.xz"
          sdk_dir="$RUNNER_TEMP/wpe-sdk"
          mkdir -p "$sdk_dir"
          gh release download "$WPE_RELEASE_TAG" \
            --repo "$WPE_RELEASE_REPOSITORY" \
            --pattern "$sdk_name*" \
            --dir "$sdk_dir"
          (cd "$sdk_dir" && sha256sum --check "$sdk_name.sha256")
          sudo tar -xJf "$sdk_dir/$sdk_name" -C /
          sudo ldconfig
          test "$(pkg-config --modversion wpe-webkit-2.0)" = "$WPE_VERSION"

      - name: Apply nightly identity and branding
        if: needs.prepare.outputs.channel == 'nightly'
        run: |
          python -m pip install Pillow
          python tool/nightly/nightly_branding.py

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build Linux release bundle
        shell: bash
        run: |
          set -euo pipefail
          flutter build linux --release \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define "UPDATE_CHANNEL=${{ needs.prepare.outputs.channel }}" \
            --dart-define "DISCORD_REPORT_WEBHOOK_URL=$DISCORD_REPORT_WEBHOOK_URL"

      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage_name="Senpwai-${VERSION}-${APPIMAGE_ARCHITECTURE}.AppImage"
          runtime_name="Senpwai-WPE-Runtime-${WPE_VERSION}-linux-${WPE_ARCHITECTURE}.tar.xz"
          bundle_dir="build/linux/${FLUTTER_ARCHITECTURE}/release/bundle"
          package_dir="$RUNNER_TEMP/appimage"
          app_dir="$package_dir/AppDir"
          runtime_dir="$RUNNER_TEMP/wpe-runtime"
          appimage_runtime="$package_dir/runtime-${APPIMAGE_ARCHITECTURE}"
          tool="$package_dir/appimagetool-${APPIMAGE_ARCHITECTURE}.AppImage"
          release_dir="build/release/linux"

          test -d "$bundle_dir"
          jq -e \
            --arg version "$VERSION" \
            --arg build "$BUILD_NUMBER" \
            '.version == $version and .build_number == $build' \
            "$bundle_dir/data/flutter_assets/version.json"
          mkdir -p "$app_dir/usr/bin" "$runtime_dir/root" "$release_dir"
          cp -a "$bundle_dir/." "$app_dir/usr/bin/"
          dart_jni="$app_dir/usr/bin/lib/libdartjni.so"
          if test -e "$dart_jni" || test -L "$dart_jni"; then
            unlink "$dart_jni"
          fi

          gh release download "$WPE_RELEASE_TAG" \
            --repo "$WPE_RELEASE_REPOSITORY" \
            --pattern "$runtime_name*" \
            --dir "$runtime_dir"
          (cd "$runtime_dir" && sha256sum --check "$runtime_name.sha256")
          tar -xJf "$runtime_dir/$runtime_name" -C "$runtime_dir/root"
          test -f "$runtime_dir/root/usr/local/lib/wpe-webkit-2.0/injected-bundle/libWPEInjectedBundle.so"
          mkdir -p "$app_dir/usr/bin/lib" "$app_dir/usr/libexec" "$app_dir/usr/share"
          cp -a "$runtime_dir/root/usr/local/lib/." "$app_dir/usr/bin/lib/"
          cp -a "$runtime_dir/root/usr/local/libexec/." "$app_dir/usr/libexec/"
          cp -a "$runtime_dir/root/usr/local/share/." "$app_dir/usr/share/"
          desktop_id=com.senpwai.app
          if [[ "${{ needs.prepare.outputs.channel }}" == "nightly" ]]; then
            desktop_id=com.senpwai.app.nightly
          fi
          cp linux/com.senpwai.app.desktop "$app_dir/$desktop_id.desktop"
          cp assets/images/senpwai-icon.png "$app_dir/$desktop_id.png"
          # Shell variables below must expand when AppRun executes.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/bin/sh' \
            'export LD_LIBRARY_PATH="$APPDIR/usr/bin/lib:${LD_LIBRARY_PATH:-}"' \
            'export WEBKIT_EXEC_PATH="$APPDIR/usr/libexec/wpe-webkit-2.0"' \
            'export WEBKIT_INJECTED_BUNDLE_PATH="$APPDIR/usr/bin/lib/wpe-webkit-2.0/injected-bundle"' \
            'export XDG_DATA_DIRS="$APPDIR/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"' \
            'exec "$APPDIR/usr/bin/senpwai" "$@"' \
            > "$app_dir/AppRun"
          chmod 755 "$app_dir/AppRun"

          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${APPIMAGE_ARCHITECTURE}.AppImage" \
            --output "$tool"
          chmod 755 "$tool"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${APPIMAGE_ARCHITECTURE}" \
            --output "$appimage_runtime"
          chmod 755 "$appimage_runtime"
          ARCH="$APPIMAGE_ARCHITECTURE" APPIMAGE_EXTRACT_AND_RUN=1 \
            "$tool" --runtime-file "$appimage_runtime" "$app_dir" "$release_dir/$appimage_name"
          chmod 755 "$release_dir/$appimage_name"
          test ! -e "$app_dir/usr/bin/lib/libdartjni.so"
          file "$release_dir/$appimage_name" | grep -q 'ELF 64-bit'
          (cd "$release_dir" && sha256sum "$appimage_name" > "$appimage_name.sha256")

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.appimage_architecture }}
          path: build/release/linux/
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build signed Android APKs
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      SENPWAI_ANDROID_KEYSTORE_BASE64: ${{ secrets.SENPWAI_ANDROID_KEYSTORE_BASE64 }}
      SENPWAI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SENPWAI_ANDROID_KEYSTORE_PASSWORD }}
      SENPWAI_ANDROID_KEY_ALIAS: ${{ secrets.SENPWAI_ANDROID_KEY_ALIAS }}
      SENPWAI_ANDROID_KEY_PASSWORD: ${{ secrets.SENPWAI_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Apply nightly identity and branding
        if: needs.prepare.outputs.channel == 'nightly'
        run: |
          python -m pip install Pillow
          python tool/nightly/nightly_branding.py

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Materialize release keystore
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
            SENPWAI_ANDROID_KEYSTORE_BASE64 \
            SENPWAI_ANDROID_KEYSTORE_PASSWORD \
            SENPWAI_ANDROID_KEY_ALIAS \
            SENPWAI_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required Android signing secret: $secret_name" >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/senpwai-release.keystore"
          printf '%s' "$SENPWAI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "SENPWAI_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build ABI-specific release APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define "UPDATE_CHANNEL=$UPDATE_CHANNEL" \
            --dart-define "DISCORD_REPORT_WEBHOOK_URL=$DISCORD_REPORT_WEBHOOK_URL"

      - name: Verify and package APKs
        shell: bash
        run: |
          set -euo pipefail
          release_dir="build/release/android"
          mkdir -p "$release_dir"
          for mapping in \
            'armeabi-v7a:arm' \
            'arm64-v8a:arm64' \
            'x86_64:x64'; do
            abi="${mapping%%:*}"
            architecture="${mapping##*:}"
            source="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            destination="$release_dir/Senpwai-${VERSION}-${architecture}.apk"
            test -f "$source"
            cp "$source" "$destination"
            build_tools_path="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
            build_tools_path="${build_tools_path%/}"
            "$build_tools_path/apksigner" verify --verbose "$destination"
            (cd "$release_dir" && sha256sum "$(basename "$destination")" > "$(basename "$destination").sha256")
          done

      - name: Upload Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: build/release/android/
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows ${{ matrix.architecture }} installer
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up Flutter
        if: matrix.architecture == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Set up Flutter from source
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterRoot = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git $flutterRoot
          "$flutterRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$flutterRoot\bin\flutter.bat" --version

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.architecture == 'arm64' && 'arm64' || 'amd64' }}

      - name: Apply nightly identity and branding
        if: needs.prepare.outputs.channel == 'nightly'
        run: |
          python -m pip install Pillow
          python tool/nightly/nightly_branding.py

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build Windows release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ARCHITECTURE -eq 'arm64') {
            $env:CL = "$env:CL /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          }
          flutter build windows --release `
            --build-name $env:VERSION `
            --build-number $env:BUILD_NUMBER `
            --dart-define "UPDATE_CHANNEL=$env:UPDATE_CHANNEL" `
            --dart-define "DISCORD_REPORT_WEBHOOK_URL=$env:DISCORD_REPORT_WEBHOOK_URL"

          $bundle = "build\windows\$env:ARCHITECTURE\runner\Release"
          if (-not (Test-Path -LiteralPath "$bundle\senpwai.exe")) {
            throw "Windows bundle was not created at $bundle"
          }
          "WINDOWS_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify native architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedMachine = if ($env:ARCHITECTURE -eq 'arm64') { 'ARM64' } else { 'x64' }
          foreach ($binary in @(
            "$env:WINDOWS_BUNDLE\senpwai.exe",
            "$env:WINDOWS_BUNDLE\torrent-rasterbar.dll"
          )) {
            if (-not (Test-Path -LiteralPath $binary)) {
              throw "Required binary is missing: $binary"
            }
            $headers = dumpbin /headers $binary
            if (-not ($headers | Select-String -SimpleMatch "machine ($expectedMachine)")) {
              throw "$binary is not a native $expectedMachine binary"
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress --limit-output

      - name: Compile unsigned installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DAppArchitecture=$env:ARCHITECTURE" scripts\setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          $releaseDir = 'build\release\windows'
          $installerName = "Senpwai-windows-$env:ARCHITECTURE-setup.exe"
          $installer = Join-Path $releaseDir $installerName
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not created: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: Test installer lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Resolve-Path "build\release\windows\Senpwai-windows-$env:ARCHITECTURE-setup.exe"
          $testDir = Join-Path $env:RUNNER_TEMP "Senpwai-$env:ARCHITECTURE-installer-test"
          if (Test-Path -LiteralPath $testDir) {
            throw "Installer test directory already exists: $testDir"
          }

          $install = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/NOICONS',
            "/DIR=$testDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)"
          }

          $installedExe = Join-Path $testDir 'senpwai.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) {
            throw 'The installed Senpwai executable is missing'
          }
          $versionInfo = (Get-Item -LiteralPath $installedExe).VersionInfo
          $expectedCompany = if ($env:UPDATE_CHANNEL -eq 'nightly') { 'com.senpwai.app.nightly' } else { 'com.senpwai.app' }
          if ($versionInfo.CompanyName -ne $expectedCompany) {
            throw "Unexpected CompanyName: $($versionInfo.CompanyName)"
          }

          $uninstaller = Join-Path $testDir 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/KEEPAPPDATA'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $installedExe)) {
            throw 'The installer lifecycle test did not uninstall Senpwai cleanly'
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.architecture }}
          path: |
            build/release/windows/Senpwai-windows-${{ matrix.architecture }}-setup.exe
            build/release/windows/Senpwai-windows-${{ matrix.architecture }}-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  stage-release:
    name: Stage draft GitHub release
    needs: [prepare, build-android, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build release update entry
        shell: bash
        run: |
          set -euo pipefail
          descriptor="$RUNNER_TEMP/release.json"
          entry="$GITHUB_WORKSPACE/release-assets/update-entry.json"
          empty_manifest="$RUNNER_TEMP/empty-update-manifest.json"
          artifacts='[]'

          for architecture in arm arm64 x64; do
            name="Senpwai-${VERSION}-${architecture}.apk"
            path="$GITHUB_WORKSPACE/release-assets/$name"
            test -f "$path"
            (cd "$(dirname "$path")" && sha256sum --check "${name}.sha256")
            artifacts="$(jq \
              --arg platform android \
              --arg architecture "$architecture" \
              --arg path "$path" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${name}" \
              '. + [{platform: $platform, architecture: $architecture, localPath: $path, url: $url}]' \
              <<<"$artifacts")"
          done

          for mapping in 'x86_64:x64' 'aarch64:arm64'; do
            package_architecture="${mapping%%:*}"
            manifest_architecture="${mapping##*:}"
            name="Senpwai-${VERSION}-${package_architecture}.AppImage"
            path="$GITHUB_WORKSPACE/release-assets/$name"
            test -f "$path"
            (cd "$(dirname "$path")" && sha256sum --check "${name}.sha256")
            artifacts="$(jq \
              --arg platform linux \
              --arg architecture "$manifest_architecture" \
              --arg path "$path" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${name}" \
              '. + [{platform: $platform, architecture: $architecture, localPath: $path, url: $url}]' \
              <<<"$artifacts")"
          done

          for architecture in x64 arm64; do
            name="Senpwai-windows-${architecture}-setup.exe"
            path="$GITHUB_WORKSPACE/release-assets/$name"
            test -f "$path"
            (cd "$(dirname "$path")" && sha256sum --check "${name}.sha256")
            artifacts="$(jq \
              --arg platform windows \
              --arg architecture "$architecture" \
              --arg path "$path" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${name}" \
              '. + [{platform: $platform, architecture: $architecture, localPath: $path, url: $url}]' \
              <<<"$artifacts")"
          done

          jq -n \
            --arg version "$VERSION" \
            --argjson build "$BUILD_NUMBER" \
            --arg channel "$RELEASE_CHANNEL" \
            --arg notes "Senpwai $VERSION" \
            --argjson artifacts "$artifacts" \
            '{version: $version, build: $build, channel: $channel, mandatory: false, notes: $notes, artifacts: $artifacts}' \
            > "$descriptor"
          printf '%s\n' '{"schemaVersion":1,"releases":[]}' > "$empty_manifest"

          cd source-directory/signer
          dart pub get --enforce-lockfile
          dart run bin/build_update_feeds.dart \
            --release "$descriptor" \
            --manifest "$empty_manifest" \
            --appcast "$RUNNER_TEMP/unused-appcast.xml"
          cp "$empty_manifest" "$entry"

      - name: Create complete draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            echo "Updating existing $([[ "$is_draft" == "true" ]] && echo draft || echo published) release $RELEASE_TAG"
          else
            release_flags=()
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            notes_file="release-notes/$VERSION.md"
            tag_flags=(--verify-tag)
            if [[ "$RELEASE_CHANNEL" == "nightly" ]]; then
              notes_file="$RUNNER_TEMP/nightly-notes.md"
              printf '# Senpwai Nightly %s\n\nAutomated nightly build from commit %s.\n' "$VERSION" "$GITHUB_SHA" > "$notes_file"
              tag_flags=(--target "$GITHUB_SHA")
            fi
            release_title="$(sed -n '1s/^# //p' "$notes_file")"
            test -n "$release_title"
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "${tag_flags[@]}" \
              --draft \
              "${release_flags[@]}" \
              --title "$release_title" \
              --notes-file "$notes_file"
          fi

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish:
    name: Publish GitHub release
    needs: [prepare, stage-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Publish completed release
        shell: bash
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" == "true" ]]; then
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --draft=false \
                --prerelease
            else
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --draft=false \
                --latest
            fi
          fi

      - name: Request Pages projection
        shell: bash
        run: |
          gh workflow run deploy-pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f release_tag="$RELEASE_TAG" \
            -f announce=${{ needs.prepare.outputs.channel != 'nightly' }}

      - name: Add workflow summary
        shell: bash
        run: |
          {
            echo "## Senpwai $VERSION"
            echo
            echo "Published $RELEASE_TAG with Android APKs, Linux x86_64/aarch64 AppImages, Windows x64/ARM64 installers, the macOS universal build, update metadata, and checksums."
          } >> "$GITHUB_STEP_SUMMARY"
