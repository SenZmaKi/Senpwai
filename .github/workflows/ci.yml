name: Flutter CI

on:
  workflow_call:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool source-directory/signer/bin

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Analyze feed tooling
        working-directory: source-directory/signer
        run: |
          dart pub get --enforce-lockfile
          dart analyze

      - name: Run tests
        run: flutter test --no-pub
