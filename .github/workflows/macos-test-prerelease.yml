name: macOS test prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Test app version (for example 3.0.1)
        required: true
        default: 3.0.0
        type: string
      build_number:
        description: Monotonically increasing Sparkle build number
        required: true
        default: "30000"
        type: string
      release_notes:
        description: Notes shown by the test updater
        required: true
        default: Senpwai macOS updater test build
        type: string

permissions:
  contents: write

concurrency:
  group: macos-test-prerelease
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Apple Silicon test artifacts
    runs-on: macos-14
    timeout-minutes: 45
    env:
      TEST_TAG: macos-update-test
      ZIP_NAME: Senpwai-macos-arm64.zip
      DMG_NAME: Senpwai-macos-arm64.dmg
      APPCAST_NAME: appcast-test.xml
      BUILD_NAME: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_NOTES: ${{ inputs.release_notes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must contain three numeric components, such as 3.0.1" >&2
            exit 64
          fi
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer" >&2
            exit 64
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Point this build at the rolling test appcast
        shell: bash
        run: |
          set -euo pipefail
          test_feed="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TEST_TAG}/${APPCAST_NAME}"
          /usr/libexec/PlistBuddy -c "Set :SUFeedURL $test_feed" macos/Runner/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' macos/Runner/Info.plist)" = "$test_feed"

      - name: Build ad-hoc-signed release app
        shell: bash
        run: |
          set -euo pipefail
          flutter build macos \
            --release \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER"

      - name: Verify and package app
        shell: bash
        run: |
          set -euo pipefail
          built_app="build/macos/Build/Products/Release/senpwai.app"
          release_dir="build/test-prerelease"
          package_root="$RUNNER_TEMP/senpwai-package"
          dmg_root="$RUNNER_TEMP/senpwai-dmg"
          extracted_root="$RUNNER_TEMP/senpwai-extracted"

          sh macos/scripts/verify_app_signature.sh "$built_app"
          mkdir -p "$release_dir" "$package_root" "$dmg_root" "$extracted_root"
          /usr/bin/ditto "$built_app" "$package_root/Senpwai.app"
          sh macos/scripts/verify_app_signature.sh "$package_root/Senpwai.app"

          /usr/bin/ditto \
            -c -k --sequesterRsrc --keepParent \
            "$package_root/Senpwai.app" \
            "$release_dir/$ZIP_NAME"
          /usr/bin/ditto -x -k "$release_dir/$ZIP_NAME" "$extracted_root"
          sh macos/scripts/verify_app_signature.sh "$extracted_root/Senpwai.app"

          /usr/bin/ditto "$package_root/Senpwai.app" "$dmg_root/Senpwai.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname "Senpwai Test" \
            -srcfolder "$dmg_root" \
            -format UDZO \
            -ov \
            "$release_dir/$DMG_NAME"
          hdiutil verify "$release_dir/$DMG_NAME"

      - name: Generate signed test appcast
        shell: bash
        env:
          SOURCE_DIRECTORY_PRIVATE_KEY: ${{ secrets.SOURCE_DIRECTORY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          release_dir="build/test-prerelease"
          repository_root="$PWD"
          zip_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TEST_TAG}/${ZIP_NAME}"
          appcast_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TEST_TAG}/${APPCAST_NAME}"
          descriptor="$RUNNER_TEMP/macos-test-release.json"
          empty_manifest="$RUNNER_TEMP/empty-update-manifest.json"

          jq -n \
            --arg version "$BUILD_NAME" \
            --argjson build "$BUILD_NUMBER" \
            --arg notes "$RELEASE_NOTES" \
            --arg path "$repository_root/$release_dir/$ZIP_NAME" \
            --arg url "$zip_url" \
            '{
              version: $version,
              build: $build,
              channel: "test",
              mandatory: false,
              notes: $notes,
              artifacts: [{
                platform: "macos",
                architecture: "arm64",
                localPath: $path,
                url: $url
              }]
            }' > "$descriptor"
          printf '%s\n' '{"schemaVersion":1,"releases":[]}' > "$empty_manifest"

          cd source-directory/signer
          dart pub get
          dart run bin/build_update_feeds.dart \
            --release "$descriptor" \
            --manifest "$empty_manifest" \
            --appcast "$repository_root/$release_dir/$APPCAST_NAME" \
            --appcast-link "$appcast_url"

      - name: Publish rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="build/test-prerelease"
          release_body="$RUNNER_TEMP/macos-test-release-notes.md"
          cat > "$release_body" <<EOF
          Rolling Senpwai macOS updater test channel.

          Version: $BUILD_NAME ($BUILD_NUMBER)
          Source: $GITHUB_SHA

          $RELEASE_NOTES

          This is an ad-hoc-signed, unnotarized Apple Silicon test build. It is not a production release.
          EOF

          if gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Senpwai macOS updater test" \
              --notes-file "$release_body"
          else
            gh release create "$TEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Senpwai macOS updater test" \
              --notes-file "$release_body"
          fi

          # Upload the new payloads before replacing the appcast so Sparkle
          # never sees metadata for files that have not reached GitHub yet.
          gh release upload "$TEST_TAG" \
            "$release_dir/$ZIP_NAME" \
            "$release_dir/$DMG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release upload "$TEST_TAG" \
            "$release_dir/$APPCAST_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Add workflow summary
        shell: bash
        run: |
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TEST_TAG}"
          {
            echo "## macOS test prerelease"
            echo
            echo "Published Senpwai $BUILD_NAME ($BUILD_NUMBER)."
            echo
            echo "[Open the rolling prerelease]($release_url)"
          } >> "$GITHUB_STEP_SUMMARY"
